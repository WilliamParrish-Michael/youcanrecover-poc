<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thank you — [Company Name]</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0f766e" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M16 24s-7-4.35-7-9.2A3.8 3.8 0 0 1 16 12a3.8 3.8 0 0 1 7 2.8C23 19.65 16 24 16 24Z' fill='%23fbbf24'/%3E%3C/svg%3E" />
  <style>
    .thanks { min-height:100vh; display:grid; place-items:center; text-align:center; padding:2rem 22px;
      background:radial-gradient(120% 90% at 50% -10%, #effcf9, var(--cream)); }
    .thanks-card { max-width:560px; }
    .thanks-badge { width:76px; height:76px; margin:0 auto 1.4rem; border-radius:50%; background:var(--teal-700);
      display:grid; place-items:center; color:#fff; box-shadow:var(--shadow); }
    .thanks h1 { font-size:clamp(2rem,5vw,2.8rem); margin-bottom:.5rem; }
    .thanks p { color:var(--ink-soft); font-size:1.1rem; }
    .thanks .crisis { margin-top:2rem; font-size:.92rem; color:var(--muted); }
    .thanks .crisis a { font-weight:700; }
    .thanks-actions { margin:1.6rem 0 .5rem; }
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-card">
      <div class="thanks-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M9.5 17.6 4.4 12.5l1.4-1.4 3.7 3.7 8.3-8.3 1.4 1.4z"/></svg>
      </div>
      <h1>Thank you — we've got your message.</h1>
      <p>A member of our care team will reach out shortly. You've taken a brave first step, and you don't have to wait alone.</p>
      <div class="thanks-actions">
        <a class="btn btn-primary" href="tel:+15551234567">Call (555) 123-4567 now</a>
      </div>
      <a href="index.html">← Back to home</a>
      <p class="crisis">In crisis or thinking about suicide? Call or text <a href="tel:988">988</a> anytime — free, confidential, 24/7.</p>
    </div>
  </main>
</body>
</html>
